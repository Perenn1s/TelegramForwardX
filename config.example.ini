# Copy to config.ini and fill in your own Telegram credentials.
[Settings]
proxy_mode = auto
proxy_type = auto
proxy_host = 127.0.0.1
proxy_port = 7890

[Telegram]
Telegram_API_ID =
Telegram_API_HASH =
Telegram_channel_username = your_channel_username

[Browser]
mode = manual
debug_port = 9223
channel = msedge
expected_username =
headless = false
timeout_seconds = 45
upload_timeout_seconds = 180
login_timeout_seconds = 900
